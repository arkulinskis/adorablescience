<div class="as-src">
  <span class="as-src-n" anvil:dom-node="n" aria-hidden="true">1</span>
  <div class="as-src-fields">
    <anvil-component type="TextBox" name="url_box" prop:type="url" prop:placeholder="https://doi.org/…  (link to the study, dataset or page)"></anvil-component>
    <div class="as-src-row2">
      <anvil-component type="TextBox" name="title_box" prop:placeholder="Title (e.g. the paper's name)"></anvil-component>
      <anvil-component type="TextBox" name="pub_box" prop:placeholder="Publisher (Nature, NASA…)"></anvil-component>
      <anvil-component type="DropDown" name="kind_box"></anvil-component>
    </div>
  </div>
  <div class="as-src-tools">
    <anvil-component type="Button" name="cite_button" prop:text="❝ Cite [1]" prop:role='["btn", "btn-soft", "btn-sm"]'></anvil-component>
    <anvil-component type="Button" name="remove_button" prop:text="✕" prop:role='["iconbtn"]'></anvil-component>
  </div>
</div>
