<div class="as-labrow">
  <span class="as-labrow-cover" anvil:dom-node="cover" aria-hidden="true"></span>
  <div class="as-labrow-main">
    <div class="as-row as-tight"><span anvil:dom-node="spec"></span><a anvil:dom-node="cat"></a><span anvil:dom-node="src"></span></div>
    <h3><a anvil:dom-node="title"></a></h3>
    <div class="as-muted as-small" anvil:dom-node="meta"></div>
  </div>
  <div class="as-labrow-actions">
    <a class="as-btn as-btn-primary as-btn-sm" anvil:dom-node="review_link" href="#review">🔬 Review</a>
    <anvil-component type="Button" name="feature_button" prop:text="☆ Feature" prop:role='["btn", "btn-ghost", "btn-sm"]'></anvil-component>
    <anvil-component type="Button" name="down_button" prop:text="🛑 Take down" prop:role='["btn", "btn-ghost", "btn-sm"]'></anvil-component>
  </div>
</div>
