<article class="as-card" anvil:dom-node="card">
  <div class="as-card-band"><span class="as-card-cover" anvil:dom-node="cover" aria-hidden="true"></span><span anvil:dom-node="spec"></span></div>
  <div class="as-card-body">
    <div class="as-row as-tight"><a anvil:dom-node="cat"></a></div>
    <h3 class="as-card-title"><a class="as-stretch" anvil:dom-node="link"></a></h3>
    <p class="as-card-dek" anvil:dom-node="dek"></p>
  </div>
  <footer class="as-card-foot">
    <a class="as-byline" anvil:dom-node="by"><span anvil:dom-node="by_av"></span><span><b anvil:dom-node="by_name"></b><span anvil:dom-node="by_extra"></span></span></a>
    <span class="as-meta"><span anvil:dom-node="src"></span><span title="Boops" anvil:dom-node="boops"></span></span>
  </footer>
</article>
