<article class="as-wcard">
  <div class="as-wcard-dish"><span anvil:dom-node="av"></span></div>
  <h2 class="as-wcard-name"><a class="as-stretch" anvil:dom-node="link"></a></h2>
  <div class="as-wcard-spec" anvil:dom-node="spec"></div>
  <p class="as-wcard-bio" anvil:dom-node="bio"></p>
  <div class="as-wcard-stats"><span><b anvil:dom-node="published"></b> published</span><span><b anvil:dom-node="sources"></b> sources</span><span><b anvil:dom-node="boops"></b> boops</span></div>
  <div class="as-badges as-badges-sm" role="list">
    <anvil-component type="RepeatingPanel" name="badge_panel" prop:item_template="Adorable_Science.Items.Badge" prop:role='["contents"]'></anvil-component>
  </div>
  <div class="as-wcard-latest">Latest: <i anvil:dom-node="latest"></i></div>
</article>
