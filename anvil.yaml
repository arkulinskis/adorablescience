allow_embedding: false
db_schema:
  articles:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: specimen_no
      type: number
    - admin_ui: {order: 1, width: 200}
      name: title
      type: string
    - admin_ui: {order: 2, width: 200}
      name: dek
      type: string
    - admin_ui: {order: 3, width: 200}
      name: body
      type: string
    - admin_ui: {order: 4, width: 200}
      name: category
      type: string
    - admin_ui: {order: 5, width: 200}
      name: evidence
      type: string
    - admin_ui: {order: 6, width: 200}
      name: cover
      type: string
    - admin_ui: {order: 7, width: 200}
      name: author
      target: users
      type: link_single
    - admin_ui: {order: 8, width: 200}
      name: status
      type: string
    - admin_ui: {order: 9, width: 200}
      name: created
      type: datetime
    - admin_ui: {order: 10, width: 200}
      name: updated
      type: datetime
    - admin_ui: {order: 11, width: 200}
      name: submitted_at
      type: datetime
    - admin_ui: {order: 12, width: 200}
      name: published_at
      type: datetime
    - admin_ui: {order: 13, width: 200}
      name: reviewer
      target: users
      type: link_single
    - admin_ui: {order: 14, width: 200}
      name: review_note
      type: string
    - admin_ui: {order: 15, width: 200}
      name: featured
      type: bool
    - admin_ui: {order: 16, width: 200}
      name: boops
      type: number
    - admin_ui: {order: 17, width: 200}
      name: n_sources
      type: number
    - admin_ui: {order: 18, width: 200}
      name: n_cited
      type: number
    - admin_ui: {order: 19, width: 200}
      name: reading_min
      type: number
    indexes: []
    server: full
    title: Articles
  boops:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: article
      target: articles
      type: link_single
    - admin_ui: {order: 1, width: 200}
      name: user
      target: users
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: at
      type: datetime
    indexes: []
    server: full
    title: Boops
  lab_log:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: article
      target: articles
      type: link_single
    - admin_ui: {order: 1, width: 200}
      name: actor
      target: users
      type: link_single
    - admin_ui: {order: 2, width: 200}
      name: action
      type: string
    - admin_ui: {order: 3, width: 200}
      name: note
      type: string
    - admin_ui: {order: 4, width: 200}
      name: at
      type: datetime
    indexes: []
    server: full
    title: Lab log
  sources:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: article
      target: articles
      type: link_single
    - admin_ui: {order: 1, width: 200}
      name: position
      type: number
    - admin_ui: {order: 2, width: 200}
      name: url
      type: string
    - admin_ui: {order: 3, width: 200}
      name: title
      type: string
    - admin_ui: {order: 4, width: 200}
      name: publisher
      type: string
    - admin_ui: {order: 5, width: 200}
      name: kind
      type: string
    indexes: []
    server: full
    title: Sources
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {order: 7, width: 200}
      client_hidden: true
      name: uid
      type: string
    - admin_ui: {order: 8, width: 200}
      client_hidden: true
      name: display_name
      type: string
    - admin_ui: {order: 9, width: 200}
      client_hidden: true
      name: avatar
      type: string
    - admin_ui: {order: 10, width: 200}
      client_hidden: true
      name: specialty
      type: string
    - admin_ui: {order: 11, width: 200}
      client_hidden: true
      name: bio
      type: string
    - admin_ui: {order: 12, width: 200}
      client_hidden: true
      name: website
      type: string
    - admin_ui: {order: 13, width: 200}
      client_hidden: true
      name: is_admin
      type: bool
    - admin_ui: {order: 14, width: 200}
      client_hidden: false
      name: legal_version
      type: string
    - admin_ui: {order: 15, width: 200}
      client_hidden: false
      name: legal_accepted_at
      type: datetime
    - admin_ui: {order: 16, width: 200}
      client_hidden: false
      name: legal_source
      type: string
    indexes: []
    server: full
    title: Users
metadata:
  description: Fuzzy-hearted, well-sourced science news written by the community and reviewed by Lab Directors.
  logo_img: asset:favicon.png
  title: Adorable Science
name: Adorable Science
native_deps:
  head_html: |
    <!-- Prepsto feedback panel: the footer's Suggest an idea link (data-prepsto-open) opens it -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="7uhztrz" data-button="false" data-label="Suggest an idea" async></script>
    <script src="_/theme/legal-kit.js?v=795d53212e"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
package_name: Adorable_Science
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: true, enable_automatically: true, use_email: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: Main, type: form}
