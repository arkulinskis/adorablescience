<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <style>
    .wob { animation: wob 1.1s ease-in-out infinite alternate; transform-origin: 57px 98px; }
    .wave { animation: slosh 1.4s linear infinite; }
    .bub { animation: rise 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .b2 { animation-delay: .6s; } .b3 { animation-delay: 1.2s; }
    .eyes { animation: blink 3.2s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes wob { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes slosh { from { transform: translateX(0); } to { transform: translateX(-28px); } }
    @keyframes rise { 0% { transform: translateY(0) scale(.4); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-30px) scale(1.15); opacity: 0; } }
    @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.1); } }
  </style>
  <defs>
    <clipPath id="flask">
      <path d="M60 129 H30 a13 13 0 0 1 -11 -20 L45 63 V36 H75 V63 L101 109 a13 13 0 0 1 -11 20 Z"/>
    </clipPath>
  </defs>
  <!-- sticker -->
  <circle cx="62" cy="62" r="54" fill="#2b2a4c"/>
  <circle cx="58" cy="58" r="54" fill="#fff9f0" stroke="#2b2a4c" stroke-width="4"/>
  <!-- Bea, scaled into the sticker -->
  <g transform="translate(58 64) scale(.66) translate(-60 -82)">
    <g class="wob">
      <circle class="bub" cx="52" cy="30" r="6" fill="#fff" stroke="#2b2a4c" stroke-width="4"/>
      <circle class="bub b2" cx="66" cy="30" r="4.5" fill="#fff" stroke="#2b2a4c" stroke-width="4"/>
      <circle class="bub b3" cx="59" cy="30" r="3.5" fill="#fff" stroke="#2b2a4c" stroke-width="4"/>
      <path d="M60 129 H30 a13 13 0 0 1 -11 -20 L45 63 V36 H75 V63 L101 109 a13 13 0 0 1 -11 20 Z" fill="#c4f3e5"/>
      <g clip-path="url(#flask)">
        <path class="wave" fill="#8fe3cb" d="M-20 82 q7 -6 14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 t14 0 V140 H-20 Z"/>
      </g>
      <path d="M60 129 H30 a13 13 0 0 1 -11 -20 L45 63 V36 H75 V63 L101 109 a13 13 0 0 1 -11 20 Z" fill="none" stroke="#2b2a4c" stroke-width="5" stroke-linejoin="round"/>
      <rect x="40" y="28" width="40" height="9" rx="4.5" fill="#fff" stroke="#2b2a4c" stroke-width="5"/>
      <ellipse cx="38" cy="108" rx="6" ry="3.5" fill="#d6408a" opacity=".45"/>
      <ellipse cx="82" cy="108" rx="6" ry="3.5" fill="#d6408a" opacity=".45"/>
      <g class="eyes">
        <circle cx="47" cy="98" r="5" fill="#2b2a4c"/><circle cx="73" cy="98" r="5" fill="#2b2a4c"/>
        <circle cx="48.8" cy="96.2" r="1.7" fill="#fff"/><circle cx="74.8" cy="96.2" r="1.7" fill="#fff"/>
      </g>
      <path d="M56 106 a4 5 0 1 0 8 0 a4 5 0 1 0 -8 0" fill="#2b2a4c"/>
    </g>
  </g>
</svg>
